egression @CommercialMember @Update\n  Scenario Outline: Update and validate the member information and staying healthy plans in member preference tab\n    \n    Login to the application\n\n    Given get data from datasheet with \"\u003ctest_id\u003e\" and \"\u003csheetName\u003e\"\n    Given Navigate to member search page\n    And select the search by subscriber id option then search for the member by using \"\u003csubscriberId\u003e\" , \"\u003cseqNumber\u003e\" , \"\u003cdob\u003e\",\"\u003cmemberState\u003e\", \"\u003cgroupNumber\u003e\" and select the \"\u003csourceSystem\u003e\"\n    Then click on member last name based on \"\u003cseqNumber\u003e\", \"\u003cfirstName\u003e\", \"\u003clastName\u003e\", \"\u003cdob\u003e\"\n    Then click on preference tab in member information page\n    Then update the Explanation of Benefits (EOBs) section with \"\u003cmail\u003e\" or \"\u003cemail\u003e\" and validate in preference tab\n    Then navigate to EOB preference history search screen\n    And validate the updated details \"\u003ccontactChannel\u003e\", \"\u003ccontactValue\u003e\", \"\u003csourceChannel\u003e\", \"\u003csourceOrigin\u003e\", \"\u003cupdatedBy\u003e\" and \"\u003cupdatedDate\u003e\" in prefernce history search screen\n    Then click on back to member information page in preference history page\n    Then click on preference tab in member information page\n    Then update the Status Updates (Optional) section with \"\u003cemail\u003e\" or \"\u003ctext\u003e\" and validate in preference tab\n    Then navigate to status update preference history search screen\n    And validate the updated details \"\u003ccontactChannel\u003e\", \"\u003ccontactValue\u003e\", \"\u003csourceChannel\u003e\", \"\u003csourceOrigin\u003e\", \"\u003cupdatedBy\u003e\" and \"\u003cupdatedDate\u003e\" in prefernce history search screen\n    Then click on back to member information page in preference history page\n    Then click on preference tab in member information page\n    Then update the preventative care reminders section with \"\u003cmail\u003e\" or \"\u003cphone\u003e\" and validate in preference tab\n    Then navigate to preventative care preference history search screen\n    And validate the updated details \"\u003ccontactChannel\u003e\", \"\u003ccontactValue\u003e\", \"\u003csourceChannel\u003e\", \"\u003csourceOrigin\u003e\", \"\u003cupdatedBy\u003e\" and \"\u003cupdatedDate\u003e\" in prefernce history search screen\n    Then click on back to member information page in preference history page\n    Then click on preference tab in member information page\n    Then update the health and wellness information section with \"\u003cemail\u003e\" or \"\u003ctext\u003e\" and validate in preference tab\n    Then navigate to health and wellness information preference history search screen\n    And validate the updated details \"\u003ccontactChannel\u003e\", \"\u003ccontactValue\u003e\", \"\u003csourceChannel\u003e\", \"\u003csourceOrigin\u003e\", \"\u003cupdatedBy\u003e\" and \"\u003cupdatedDate\u003e\" in prefernce history search screen\n    Then click on back to member information page in preference history page\n    Then click on preference tab in member information page\n    And click on clear selection and see email and text options are deselected in status update section\n\n    Examples: \n      | test_id | sheetName                      |\n      |       8 | Cmrcl_Mbr_Text_Mail_Email_Pref |\n      |       9 | Cmrcl_Mbr_Text_Mail_Email_Pref |\n\n  @Regression @CommercialMember @Update\n  Scenario Outline: Update and validate all the preference options under Health and Wellness Programs and Discounts (Optional) section\n    \n    Login to the application\n\n    Given get data from datasheet with \"\u003ctest_id\u003e\" and \"\u003csheetName\u003e\"\n    Given Navigate to member search page\n    And select the search by subscriber id option then search for the member by using \"\u003csubscriberId\u003e\" , \"\u003cseqNumber\u003e\" , \"\u003cdob\u003e\",\"\u003cmemberState\u003e\", \"\u003cgroupNumber\u003e\" and select the \"\u003csourceSystem\u003e\"\n    Then click on member last name based on \"\u003cseqNumber\u003e\", \"\u003cfirstName\u003e\", \"\u003clastName\u003e\", \"\u003cdob\u003e\"\n    Then click on preference tab in member information page\n    Then update the health and wellness programs section with \"\u003cemail\u003e\", \"\u003cmail\u003e\" , \"\u003cphone\u003e\" and \"\u003ctext\t\u003e\" and validate the details in preference history page\n\n    Examples: \n      | test_id | sheetName                      |\n      |      10 | Cmrcl_Mbr_Text_Mail_Email_Pref |\n      |      11 | Cmrcl_Mbr_Text_Mail_Email_Pref |\n\n  @Regression @CommercialMember @Update\n  Scenario Outline: Validate language update, reset and error messages in member preference tab\n    \n    Login to the application\n\n    Given get data from datasheet with \"\u003ctest_id\u003e\" and \"\u003csheetName\u003e\"\n    Given Navigate to member search page\n    And select the search by subscriber id option then search for the member by using \"\u003csubscriberId\u003e\" , \"\u003cseqNumber\u003e\" , \"\u003cdob\u003e\",\"\u003cmemberState\u003e\", \"\u003cgroupNumber\u003e\" and select the \"\u003csourceSystem\u003e\"\n    Then click on member last name based on \"\u003cseqNumber\u003e\", \"\u003cfirstName\u003e\", \"\u003clastName\u003e\", \"\u003cdob\u003e\"\n    Then click on preference tab in member information page\n    And select the \"\u003cspokenLanguage\u003e\" and \"\u003cwrittenLanguage\u003e\" in member preference tab\n    Then click on reset button in member preference tab\n    And validate the language options are reset to old options\n    Then click on submit in member preference tab\n    And validate the \"\u003cerrorMessage\u003e\" in member preference tab\n    And select the \"\u003cspokenLanguage\u003e\" and \"\u003cwrittenLanguage\u003e\" in member preference tab\n    Then click on submit in memb etails in consent or do not call or wrong number file status page\n\n    Examples: \n      | test_id | sheetName        |\n      |       1 | ConsentOrDncOrWn |\n      |       2 | ConsentOrDncOrWn |\n      |       3 | ConsentOrDncOrWn |\n      |       4 | ConsentOrDncOrWn |\n      |       5 | ConsentOrDncOrWn |\n\n  @Regression @Alert @ConsentOrDncOrWn @Alert\n  Scenario Outline: Alert messages validation while trying to create consent or do not call or wrong number file without attaching document and not selecting header details\n    \n    Login to the application\n\n    Given get data from datasheet with \"\u003ctest_id\u003e\" and \"\u003csheetName\u003e\"\n    Given Navigate to consent or do not call or wrong number  page\n    And click on add consent or do not call or wrong number file button\n    And click on submit in create consent or do not call or wrong number file  page\n    Then validate the error message \"This field may not be blank\" in create consent or do not call or wrong number file page\n    And click on reset button in create consent or do not call or wrong number file page\n    And select header details by using \"\u003cAnthem call type\u003e\", \"\u003cData type\u003e\" and \"\u003cSource name\u003e\"\n    And click on submit in create consent or do not call or wrong number file  page\n    Then validate the error message \"Please select the file to upload\" in create consent or do not call or wrong number file page\n    And click on cancel button in create consent or do not call or wrong number file page and verify user navigated back to consent or do not call or wrong number file page\n\n    Examples: \n      | test_id | sheetName        |\n      |       6 | ConsentOrDncOrWn |\n      |       7 | ConsentOrDncOrWn |\n      |       8 | ConsentOrDncOrWn |\n      |       9 | ConsentOrDncOrWn |\n      |      10 | ConsentOrDncOrWn |\n\n  @Regression @ConsentOrDncOrWn\n  Scenario: Verify the sorting order in consent or do not call or wrong number file status page\n    \n    Login to the application\n\n    Given Navigate to consent or do not call or wrong number  page\n    And verify the sorting order in consent or do not call or wrong number file status page\n\n  @Regression @ConsentOrDncOrWn @Alert\n  Scenario Outline: create a consent or do not call or wrong number file with more than  20000 phone numbers\n    \n    Login to the application\n\n    Given get data from datasheet with \"\u003ctest_id\u003e\" and \"\u003csheetName\u003e\"\n    Given Navigate to consent or do not call or wrong number  page\n    And click on add consent or do not call or wrong number file button\n    And select header details by using \"\u003cAnthem call type\u003e\", \"\u003cData type\u003e\" and \"\u003cSource name\u003e\"\n    Then upload the \"\u003cDocument\u003e\" in create a consent or do not call or wrong number file page\n    And click on submit in create consent or do not call or wrong number file  page\n    Then verify the message \"ERROR. Please contact \"TCPAComplianceHelpDesk@Anthem.com” to process your file.\" in create a consent or do not call or wrong number file page\n\n    Examples: \n      | test_id | sheetName        |\n      |      11 | ConsentOrDncOrWn |\n      |      12 | ConsentOrDncOrWn |\n      |      13 | ConsentOrDncOrWn |\n      |      14 | ConsentOrDncOrWn |\n      |      15 | ConsentOrDncOrWn |\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:///C:/Users/AG53052/EclipseWorkspace/CPSUI_Automation/src/test/resources/features/ConsentOrDncOrWnFile.feature","feature":{"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Consent or Do not call or Wrong number file page","children":[{"scenario":{"location":{"line":4,"column":3},"tags":[{"location":{"line":3,"column":3},"name":"@Regression","id":"346c7473-2a73-480c-9af0-69f99ef7cc45"},{"location":{"line":3,"column":15},"name":"@Update","id":"6411b8f4-1b0c-48fa-aa70-b6acef29e948"},{"location":{"line":3,"c in government email history page\n\n    Examples: \n      | test_id | sheetName                 |\n      |       1 | GovtMemberContactInfEmail |\n\n  @Regression @GovernmentMember @Update\n  Scenario Outline: Update the email address in government member contact information page and verify in government email history page\n    \n    Login to the application\n\n    Given get data from datasheet with \"\u003ctest_id\u003e\" and \"\u003csheetName\u003e\"\n    Given Navigate to member search page\n    And select the search by subscriber id option then search for the member by using \"\u003csubscriberId\u003e\" , \"\u003cseqNumber\u003e\" , \"\u003cdob\u003e\",\"\u003cmemberState\u003e\", \"\u003cgroupNumber\u003e\" and select the \"\u003csourceSystem\u003e\"\n    Then click on member last name based on \"\u003cseqNumber\u003e\", \"\u003cfirstName\u003e\", \"\u003clastName\u003e\", \"\u003cdob\u003e\"\n    And enter the new \"\u003cemailAddress\u003e\" and click on reset and verify in government member contact information page\n    And update and validate the \"\u003cemailAddress\u003e\" in government member contact information page\n    Then navigate to government email history page\n    And verify the updated email details in government email history page\n    Then click on back to member information page in government email history page\n\n    Examples: \n      | test_id | sheetName                 |\n      |       2 | GovtMemberContactInfEmail |\n\n  @Regression @GovernmentMember\n  Scenario Outline: Validate the member phone number details in government member contact information page\n    \n    Login to the application\n\n    Given get data from datasheet with \"\u003ctest_id\u003e\" and \"\u003csheetName\u003e\"\n    Given Navigate to member search page\n    And select the search by subscriber id option then search for the member by using \"\u003csubscriberId\u003e\" , \"\u003cseqNumber\u003e\" , \"\u003cdob\u003e\",\"\u003cmemberState\u003e\", \"\u003cgroupNumber\u003e\" and select the \"\u003csourceSystem\u003e\"\n    Then click on member last name based on \"\u003cseqNumber\u003e\", \"\u003cfirstName\u003e\", \"\u003clastName\u003e\", \"\u003cdob\u003e\"\n    And verify the phone number details \"\u003cphoneNumber\u003e\", \"\u003cvalue1\u003e\", \"\u003cvalue2\u003e\", \"\u003cupdatedBy\u003e\", \"\u003cupdatedDate\u003e\" in government member contact information page\n    Then navigate to government phone history page\n    And search for the specific dates \"\u003cfromDate\u003e\", \"\u003cendDate\u003e\" in phone history page\n    And verify the existing details \"\u003ctelephoneNumber\u003e\", \"\u003csales\u003e\", \"\u003cnonSales\u003e\", \"\u003cupdatedBy\u003e\", \"\u003cupdatedDate\u003e\" in government member phone history page \n\n    Examples: \n      | test_id | sheetName                 |\n      |       1 | GovtMemberContactInfPhone |\n\n  @Regression @GovernmentMember @Update\n  Scenario Outline: Update the mobile preferences in government member contact information page and verify in phone history page\n    \n    Login to the application\n\n    Given get data from datasheet with \"\u003ctest_id\u003e\" and \"\u003csheetName\u003e\"\n    Given Navigate to member search page\n    And select the search by subscriber id option then search for the member by using \"\u003csubscriberId\u003e\" , \"\u003cseqNumber\u003e\" , \"\u003cdob\u003e\",\"\u003cmemberState\u003e\", \"\u003cgroupNumber\u003e\" and select the \"\u003csourceSystem\u003e\"\n    Then click on member last name based on \"\u003cseqNumber\u003e\", \"\u003cfirstName\u003e\", \"\u003clastName\u003e\", \"\u003cdob\u003e\"\n    And update and validate the phone number non-sales preference with \"\u003cvalue1\u003e\" and \"\u003cvalue2\u003e\" details in government member contact information page\n    And if the non-sales value is consent then the reconfirm checkbox should be enabled else disabled in government member contact information page\n    Then navigate to government phone history page\n    And verify the updated details in phone history table through government member information page\n\n    Examples: \n      | test_id | sheetName                 |\n      |       2 | GovtMemberContactInfPhone |\n      |       3 | GovtMemberContactInfPhone |\n\n  @Regression @GovernmentMember\n  Scenario Outline: Validate the member text number details in government member contact information page\n    \n    Login to the application\n\n    Given get data from datasheet with \"\u003ctest_id\u003e\" and \"\u003csheetName\u003e\"\n    Given Navigate to member search page\n    And select the search by subscriber id option then search for the member by using \"\u003csubscriberId\u003e\" , \"\u003cseqNumber\u003e\" , \"\u003cdob\u003e\",\"\u003cmemberState\u003e\", \"\u003cgroupNumber\u003e\" and select the \"\u003csourceSystem\u003e\"\n    Then click on member last name based on \"\u003cseqNumber\u003e\", \"\u003cfirstName\u003e\", \"\u003clastName\u003e\", \"\u003cdob\u003e\"\n    And validate the member text number details \"\u003cpreferred\u003e\", \"\u003cphoneNumber\u003e\", \"\u003csourceChannel\u003e\",  \"\u003csourceOrigin\u003e\", \"\u003cupdatedBy\u003e\", \"\u003cupdatedDate\u003e\"  in government member contact information page\n\n    Examples: \n      | test_id | sheetName                     |\n      |       1 | Govt_Mbr_Text_Mail_Email_Pref |\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:///C:/Users/AG53052/EclipseWorkspace/CPSUI_Automation/src/test/resources/features/GovernmentMemberContactInfo.feature","feature":{"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Government member contact information","children":[{"scenario":{"location":{"line":4,"column":3},"tags":[{"location":{"line":3,"column":3},"name":"@Regression","id":"47163bc7-ccfe-400e-b557-2f401a4064bb"},{"location":{"line":3,"column":15},"name":"@GovernmentMember","id":"cdd53f3e-cde8-43e3 ls\n    And if the non-sales value is consent then the reconfirm checkbox should be enabled else disabled\n\n    Examples: \n      | test_id | sheetName   |\n      |       4 | PhoneSearch |\n      |       5 | PhoneSearch |\n      |       6 | PhoneSearch |\n      |       7 | PhoneSearch |\n      |       8 | PhoneSearch |\n      |       9 | PhoneSearch |\n\n  @PhoneSearch @Regression @Alert\n  Scenario Outline: Unauthorized alert validation\n    \n    Login to the application\n\n    Given get data from datasheet with \"\u003ctest_id\u003e\" and \"\u003csheetName\u003e\"\n    Given enter the \"\u003cphone number\u003e\" and search for it\n    And update the non-sales preference value from wrong number to \"\u003cvalue1\u003e\" if the last updated by is MARPLTN\n    Then validate the unauthorized error message \"User not authorized to update this phone number. Notice is being sent to the TCPA Compliance Help Desk for resolution.\"\n\n    Examples: \n      | test_id | sheetName   |\n      |      10 | PhoneSearch |\n      |      11 | PhoneSearch |\n\n  @PhoneSearch @Regression \n  Scenario Outline: Reset the parameters in phone search screen\n    \n        Login to the application\n\n    Given get data from datasheet with \"\u003ctest_id\u003e\" and \"\u003csheetName\u003e\"\n    Given enter the \"\u003cphone number\u003e\" and search for it\n    And change the preferences of sales and non-sales values and then reset \u0026 verify the changes.\n\n    Examples: \n      | test_id | sheetName   |\n      |      12 | PhoneSearch |\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"file:///C:/Users/AG53052/EclipseWorkspace/CPSUI_Automation/src/test/resources/features/PhoneSearch.feature","feature":{"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Phone search","children":[{"scenario":{"location":{"line":4,"column":3},"tags":[{"location":{"line":3,"column":3},"name":"@Regression","id":"210210ef-7677-4a84-a646-a0d793aa312f"},{"
